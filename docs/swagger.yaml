basePath: /
definitions:
  internal_handlers.AuthRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal_handlers.CreateImageTaskRequest:
    properties:
      filter:
        $ref: '#/definitions/photo_editor_internal_models.Filter'
      image:
        type: string
    type: object
  internal_handlers.CreateTaskResponse:
    properties:
      task_id:
        type: string
    type: object
  internal_handlers.GetStatusResponse:
    properties:
      status:
        type: string
    type: object
  internal_handlers.LoginResponse:
    properties:
      token:
        type: string
    type: object
  photo_editor_internal_models.CommitRequest:
    properties:
      result:
        type: string
      status:
        type: string
      task_id:
        type: string
    type: object
  photo_editor_internal_models.Filter:
    properties:
      name:
        type: string
      parameters:
        items:
          type: integer
        type: array
    type: object
host: localhost:8001
info:
  contact: {}
  description: |-
    Asynchronous image processing API with RabbitMQ and session-based authentication.
    Supported filters: Negative, Blur, Sharpen, and FlipX.
  version: "3.0"
paths:
  /commit:
    post:
      consumes:
      - application/json
      description: |-
        Internal endpoint used by ImageProcessor to report task completion.
        Status must be ready or failed.
        If status is ready, result must contain a Base64-encoded PNG.
      parameters:
      - description: Task ID, status and processing result
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/photo_editor_internal_models.CommitRequest'
      responses:
        "204":
          description: Result successfully committed
        "400":
          description: Invalid request body or task status
          schema:
            type: string
        "404":
          description: Task not found
          schema:
            type: string
      summary: Commit image processing result
      tags:
      - internal
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and creates a new session
      parameters:
      - description: User login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authentication successful
          schema:
            $ref: '#/definitions/internal_handlers.LoginResponse'
        "400":
          description: Invalid JSON
          schema:
            type: string
        "401":
          description: Invalid username or password
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Authenticate a user
      tags:
      - auth
  /register:
    post:
      consumes:
      - application/json
      description: Registers a new user with a username and password
      parameters:
      - description: User registration credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.AuthRequest'
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Invalid JSON or missing credentials
          schema:
            type: string
        "409":
          description: User already exists
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Register a new user
      tags:
      - auth
  /result/{id}:
    get:
      description: |-
        Returns the processed PNG image when the task status is ready.
        Returns HTTP 409 if the task is still processing or has failed.
      parameters:
      - description: Task ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: Processed PNG image
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Task not found
          schema:
            type: string
        "409":
          description: Task is not ready
          schema:
            type: string
        "500":
          description: Failed to decode task result
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Download processed image
      tags:
      - tasks
  /status/{id}:
    get:
      description: 'Returns the current task status: in_progress, ready, or failed.'
      parameters:
      - description: Task ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Current task status
          schema:
            $ref: '#/definitions/internal_handlers.GetStatusResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Task not found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get image processing task status
      tags:
      - tasks
  /task:
    post:
      consumes:
      - application/json
      description: |-
        Creates an asynchronous image processing task using RabbitMQ.
        The image must be a Base64-encoded PNG.
        Supported filters: Negative, Blur, Sharpen, FlipX.
        Blur and Sharpen require parameters.sigma greater than 0 and not greater than 20.
      parameters:
      - description: Image and filter configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateImageTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Task successfully created
          schema:
            $ref: '#/definitions/internal_handlers.CreateTaskResponse'
        "400":
          description: Invalid JSON, missing image or filter
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "413":
          description: Image task is too large
          schema:
            type: string
        "503":
          description: Failed to publish task to RabbitMQ
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create an image processing task
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: 'Enter your session token in the format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
