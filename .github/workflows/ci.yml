name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate processor token
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "PROCESSOR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Build server
        run: go build -o /tmp/photo-server ./cmd/server

      - name: Build processor
        run: go build -o /tmp/photo-processor ./cmd/processor

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install pytest requests Pillow "pika<2"

      - name: Install sql-migrate
        run: go install github.com/rubenv/sql-migrate/...@latest

      - name: Start infrastructure
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres redis rabbitmq

      - name: Create test database
        run: docker compose exec -T postgres createdb -U photo photo_editor_test

      - name: Apply database migrations
        run: |
          "$(go env GOPATH)/bin/sql-migrate" up -env=development
          "$(go env GOPATH)/bin/sql-migrate" up -env=test

      - name: Run Go and PostgreSQL tests
        env:
          POSTGRES_TEST_URL: postgres://photo:photo@localhost:5430/photo_editor_test?sslmode=disable
        run: go test -race -v -count=1 ./...

      - name: Start Docker services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Wait for API
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors \
            --retry-delay 1 --max-time 5 \
            http://localhost:8001/metrics > /dev/null

      - name: Run integration tests
        run: python -m pytest -v --tb=short test.py

      - name: Run course integration tests
        run: python -m pytest -v --tb=short tests/course/test_course.py

      - name: Run RabbitMQ integration tests
        run: python -m pytest -v --tb=short test_rabbitmq.py

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker services
        if: always()
        run: docker compose down