name: Go Ci

on:
    push:
    pull_request:
    
permissions:
    contents: read

jobs:
    test:
        name: Build and Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version-file: go.mod
                cache: true

            - name: Run go vet
              run: go vet ./...

            - name: Run tests
              run: go test -v ./...

            - name: Build server
              run: go build -o /tmp/photo-server ./cmd/server

            - name: Build processor
              run: go build -o /tmp/photo-processor ./cmd/processor

              
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
              
            - name: Install Python dependencies
              run: python -m pip install pytest requests Pillow
              
            - name: Start Docker services
              run: docker compose up --build --wait --wait-timeout 120
              
            - name: Run integration tests
              run: python -m pytest -v test.py
              
            - name: Show Docker logs on failure
              if: failure()
              run: docker compose logs --no-color
              
            - name: Stop Docker services
              if: always()
              run: docker compose down